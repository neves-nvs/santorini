asyncapi: 3.0.0
info:
  title: Santorini WebSocket API
  version: 0.1.0
  description: |
    Live play: joining a game, readiness, moves and the updates the server pushes. Accounts, the game lists and
    creating a game are in `openapi.yaml`. The TypeScript types for these messages are in `@santorini/shared`
    (`packages/shared/src/websocket-types.ts` and `game-types.ts`).

    **Commands and replies.** A client sends a command, JSON text shaped `{ "type": string, "id"?: string, "payload": object }`.
    `id` is a string of 1 to 64 characters that the client chooses; it is optional. The server answers every command with
    exactly one `ok` or `error` carrying the same `id` (no `id` when the command had none). When a command changes a game, the
    resulting `game_state` reaches every subscribed socket, the sender included, before the `ok`.

    **Heartbeat.** The client sends `ping` with an empty payload every 15 seconds, and reconnects if no reply arrives
    within 10 seconds. The server also sends WebSocket control pings every 30 seconds and terminates sockets that
    miss the next pong. These pings require no game subscription.

    **Errors.** The payload of an `error` is `{ code, message, details? }`. `code` is stable and meant for programs, `message`
    for people, `details.issues` lists the invalid fields of an `invalid_payload`. A message that is not a JSON object has the
    code `invalid_message`; an unknown `type` has `unknown_type`. Details of an unexpected failure stay in the server log: the
    client gets `internal`. A message larger than 16 KiB closes the connection with close code 1009.

    **Joining and subscribing are separate.** `join_game` makes the user a player. `subscribe_game` registers this socket
    for the game's updates, as a player or as a watcher, and sends the current state before it answers `ok`. A client that is
    playing sends both. Only a subscribed socket receives `game_state`, after every change to the game: a join, a leave, a ready, a move. A player who
    has not clicked ready is removed from a waiting game when their last joined or subscribed socket closes.
    A replacement join protects the seat before it subscribes. Disconnect cleanup and game commands execute in order
    within each game. A ready player keeps the seat.

defaultContentType: application/json
servers:
  local:
    host: localhost:3000
    protocol: ws
    description: Server run directly
  compose:
    host: localhost:8080
    protocol: ws
    pathname: /ws
    description: Through the compose nginx
    security:
      - $ref: "#/components/securitySchemes/wsTicket"
channels:
  game:
    address: /
    description: |
      One connection per browser window. The upgrade is refused with 401 without a valid token and with 403 when the
      `Origin` header is not an allowed origin or the server's own origin.
    messages:
      ping: { $ref: "#/components/messages/ping" }
      joinGame: { $ref: "#/components/messages/joinGame" }
      leaveGame: { $ref: "#/components/messages/leaveGame" }
      subscribeGame: { $ref: "#/components/messages/subscribeGame" }
      setReady: { $ref: "#/components/messages/setReady" }
      makeMove: { $ref: "#/components/messages/makeMove" }
      ok: { $ref: "#/components/messages/ok" }
      error: { $ref: "#/components/messages/error" }
      gameState: { $ref: "#/components/messages/gameState" }
operations:
  ping:
    action: receive
    channel: { $ref: "#/channels/game" }
    summary: Check that the connection is responsive
    messages: [{ $ref: "#/channels/game/messages/ping" }]
    reply:
      channel: { $ref: "#/channels/game" }
      messages: [{ $ref: "#/channels/game/messages/ok" }, { $ref: "#/channels/game/messages/error" }]
  joinGame:
    action: receive
    channel: { $ref: "#/channels/game" }
    summary: Take a seat in a game
    description: |
      Idempotent: a user already in the game gets `ok` again and nothing is published. A full, started or
      unknown game gives an `error`. Does not subscribe the socket. The `ok` carries the `gameId`.
    messages: [{ $ref: "#/channels/game/messages/joinGame" }]
    reply:
      channel: { $ref: "#/channels/game" }
      messages: [{ $ref: "#/channels/game/messages/ok" }, { $ref: "#/channels/game/messages/error" }]
  leaveGame:
    action: receive
    channel: { $ref: "#/channels/game" }
    summary: Give up a seat in a waiting game
    description: The `ok` carries the `gameId`. The socket stops following the game, and the other subscribers receive the new `game_state`.
    messages: [{ $ref: "#/channels/game/messages/leaveGame" }]
    reply:
      channel: { $ref: "#/channels/game" }
      messages: [{ $ref: "#/channels/game/messages/ok" }, { $ref: "#/channels/game/messages/error" }]
  subscribeGame:
    action: receive
    channel: { $ref: "#/channels/game" }
    summary: Receive a game's updates
    description: |
      Open to any logged-in user, so someone who is not in the game can watch it. Sends a `game_state` with the
      user's view, then answers `ok` with the `gameId`. A connection follows one game: subscribing again, to the same game
      or another, gives an `error` (`invalid_game_state`), so a client opens a new connection for each game page.
      If the initial snapshot fails, the subscription is rolled back and the same socket can retry.
    messages: [{ $ref: "#/channels/game/messages/subscribeGame" }]
    reply:
      channel: { $ref: "#/channels/game" }
      messages: [{ $ref: "#/channels/game/messages/ok" }, { $ref: "#/channels/game/messages/error" }]
  setReady:
    action: receive
    channel: { $ref: "#/channels/game" }
    summary: Confirm or withdraw readiness
    description: |
      The game starts when every seat is taken and every player is ready. The new state reaches the subscribed sockets as
      a `game_state`; the `ok` has an empty payload.
    messages: [{ $ref: "#/channels/game/messages/setReady" }]
    reply:
      channel: { $ref: "#/channels/game" }
      messages: [{ $ref: "#/channels/game/messages/ok" }, { $ref: "#/channels/game/messages/error" }]
  makeMove:
    action: receive
    channel: { $ref: "#/channels/game" }
    summary: Play a move
    description: |
      A position counts only with integer `x` and `y` from 0 to 4. Anything else gives an `invalid_payload`; a move out of
      turn gives `not_your_turn` and a move the rules forbid gives `illegal_move`. On success every subscribed player
      receives a `game_state`, then the sender gets an `ok` with an empty payload.
    messages: [{ $ref: "#/channels/game/messages/makeMove" }]
    reply:
      channel: { $ref: "#/channels/game" }
      messages: [{ $ref: "#/channels/game/messages/ok" }, { $ref: "#/channels/game/messages/error" }]
  receiveGameState:
    action: send
    channel: { $ref: "#/channels/game" }
    summary: A game changed
    messages: [{ $ref: "#/channels/game/messages/gameState" }]
components:
  messages:
    ping:
      name: ping
      payload:
        type: object
        required: [type, payload]
        properties:
          type: { const: ping }
          id: { $ref: "#/components/schemas/RequestId" }
          payload:
            type: object
            additionalProperties: false
    joinGame:
      name: join_game
      payload:
        type: object
        required: [type, payload]
        properties:
          type: { const: join_game }
          id: { $ref: "#/components/schemas/RequestId" }
          payload: { $ref: "#/components/schemas/GameIdPayload" }
    leaveGame:
      name: leave_game
      payload:
        type: object
        required: [type, payload]
        properties:
          type: { const: leave_game }
          id: { $ref: "#/components/schemas/RequestId" }
          payload: { $ref: "#/components/schemas/GameIdPayload" }
    subscribeGame:
      name: subscribe_game
      payload:
        type: object
        required: [type, payload]
        properties:
          type: { const: subscribe_game }
          id: { $ref: "#/components/schemas/RequestId" }
          payload: { $ref: "#/components/schemas/GameIdPayload" }
    setReady:
      name: set_ready
      payload:
        type: object
        required: [type, payload]
        properties:
          type: { const: set_ready }
          id: { $ref: "#/components/schemas/RequestId" }
          payload:
            type: object
            required: [gameId, isReady]
            properties:
              gameId: { type: integer }
              isReady: { type: boolean }
    makeMove:
      name: make_move
      payload:
        type: object
        required: [type, payload]
        properties:
          type: { const: make_move }
          id: { $ref: "#/components/schemas/RequestId" }
          payload:
            type: object
            required: [gameId, move]
            properties:
              gameId: { type: integer }
              move: { $ref: "#/components/schemas/MoveCommand" }
    ok:
      name: ok
      summary: A command worked
      payload:
        type: object
        required: [type, payload]
        properties:
          type: { const: ok }
          id: { $ref: "#/components/schemas/RequestId" }
          payload:
            type: object
            properties:
              gameId: { type: integer }
    error:
      name: error
      summary: A command failed, or a message could not be read
      payload:
        type: object
        required: [type, payload]
        properties:
          type: { const: error }
          id: { $ref: "#/components/schemas/RequestId" }
          payload: { $ref: "#/components/schemas/WireError" }
    gameState:
      name: game_state
      summary: The game as this user sees it
      description: |
        Sent to every subscribed socket after every change to the game, and when a socket subscribes. A finished game is a
        state with `status` `completed`, `winnerUserId` and `winReason`. A watcher gets it too, with `viewer.role` `spectator`.
      payload:
        type: object
        required: [type, payload]
        properties:
          type: { const: game_state }
          payload: { $ref: "#/components/schemas/GameView" }
  schemas:
    RequestId:
      type: string
      minLength: 1
      maxLength: 64
    WireError:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          enum:
            - invalid_message
            - invalid_payload
            - unknown_type
            - game_not_found
            - game_full
            - already_in_game
            - not_in_game
            - invalid_game_state
            - not_your_turn
            - illegal_move
            - validation_failed
            - unauthorized
            - forbidden
            - user_exists
            - user_not_found
            - rate_limited
            - internal
        message: { type: string }
        details:
          type: object
          required: [issues]
          properties:
            issues:
              type: array
              items:
                type: object
                required: [path, message]
                properties:
                  path: { type: array, items: { type: string } }
                  message: { type: string }
    GameIdPayload:
      type: object
      required: [gameId]
      properties:
        gameId: { type: integer }
    GameStatus:
      type: string
      enum: [waiting, in-progress, completed]
    GamePhase:
      type: [string, "null"]
      enum: [placing, moving, building, null]
    Position:
      type: object
      required: [x, y]
      properties:
        x: { type: integer, minimum: 0, maximum: 4 }
        y: { type: integer, minimum: 0, maximum: 4 }
    MoveCommand:
      description: A move sent by a client. `workerId` is optional for placement and movement.
      oneOf:
        - type: object
          required: [type, position]
          properties:
            type: { const: place_worker }
            workerId: { type: integer }
            position: { $ref: "#/components/schemas/Position" }
        - type: object
          required: [type, fromPosition, position]
          properties:
            type: { const: move_worker }
            workerId: { type: integer }
            fromPosition: { $ref: "#/components/schemas/Position" }
            position: { $ref: "#/components/schemas/Position" }
        - type: object
          required: [type, position]
          properties:
            type: { enum: [build_block, build_dome] }
            position: { $ref: "#/components/schemas/Position" }
    Move:
      description: A move the server offers to the player whose turn it is.
      oneOf:
        - type: object
          required: [type, workerId, position]
          properties:
            type: { const: place_worker }
            workerId: { type: integer }
            position: { $ref: "#/components/schemas/Position" }
        - type: object
          required: [type, workerId, fromPosition, position]
          properties:
            type: { const: move_worker }
            workerId: { type: integer }
            fromPosition: { $ref: "#/components/schemas/Position" }
            position: { $ref: "#/components/schemas/Position" }
        - type: object
          required: [type, workerId, position]
          properties:
            type: { enum: [build_block, build_dome] }
            workerId: { type: integer }
            position: { $ref: "#/components/schemas/Position" }
    GameView:
      description: |
        A game as one user sees it. `status` decides which of the other fields are set: a game that has not started
        has no phase, current player or winner, a game in progress has a phase and a current player, and a finished
        one has a winner and the reason, and nobody to move. `currentSeat` is a position in `players`, counted from 0,
        and `winnerUserId` is the user who won.
      oneOf:
        - $ref: "#/components/schemas/WaitingGameView"
        - $ref: "#/components/schemas/InProgressGameView"
        - $ref: "#/components/schemas/CompletedGameView"
      discriminator:
        propertyName: status
        mapping:
          waiting: "#/components/schemas/WaitingGameView"
          in-progress: "#/components/schemas/InProgressGameView"
          completed: "#/components/schemas/CompletedGameView"
    WaitingGameView:
      allOf:
        - $ref: "#/components/schemas/GameViewBase"
        - type: object
          required: [status, phase, currentSeat, winnerUserId, winReason]
          properties:
            status: { const: waiting }
            phase: { type: "null" }
            currentSeat: { type: "null" }
            winnerUserId: { type: "null" }
            winReason: { type: "null" }
    InProgressGameView:
      allOf:
        - $ref: "#/components/schemas/GameViewBase"
        - type: object
          required: [status, phase, currentSeat, winnerUserId, winReason]
          properties:
            status: { const: in-progress }
            phase: { enum: [placing, moving, building] }
            currentSeat: { type: integer }
            winnerUserId: { type: "null" }
            winReason: { type: "null" }
    CompletedGameView:
      allOf:
        - $ref: "#/components/schemas/GameViewBase"
        - type: object
          required: [status, phase, currentSeat, winnerUserId, winReason]
          properties:
            status: { const: completed }
            phase: { type: "null" }
            currentSeat: { type: "null" }
            winnerUserId: { type: integer }
            winReason: { enum: [win_condition, opponent_trapped] }
    GameViewBase:
      type: object
      required: [gameId, maxPlayers, turnNumber, version, board, players, viewer]
      properties:
        gameId: { type: integer }
        maxPlayers: { type: integer }
        turnNumber: { type: integer }
        version: { type: integer }
        board:
          type: object
          required: [cells]
          properties:
            cells:
              type: array
              description: 5 columns of 5 cells, indexed `cells[x][y]`
              items:
                type: array
                items:
                  type: object
                  required: [height, hasDome, worker]
                  properties:
                    height: { type: integer, minimum: 0, maximum: 3 }
                    hasDome: { type: boolean }
                    worker:
                      oneOf:
                        - type: "null"
                        - type: object
                          required: [seat, workerId]
                          properties:
                            seat: { type: integer }
                            workerId: { type: integer }
        players:
          type: array
          items:
            type: object
            description: A player has no seat field. The position in `players` is the seat, counted from 0.
            required: [userId, isReady]
            properties:
              userId: { type: integer }
              isReady: { type: boolean }
        viewer: { $ref: "#/components/schemas/Viewer" }
    Viewer:
      description: Who is looking. A player gets the moves they can play now; a watcher, or someone whose seat was freed, gets none.
      oneOf:
        - type: object
          required: [role, isCurrentPlayer, availableMoves]
          properties:
            role: { const: player }
            isCurrentPlayer: { type: boolean }
            availableMoves:
              type: array
              description: Empty unless it is this player's turn
              items: { $ref: "#/components/schemas/Move" }
        - type: object
          required: [role]
          properties:
            role: { const: spectator }
