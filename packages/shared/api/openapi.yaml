openapi: 3.1.0
info:
  title: Santorini REST API
  version: 0.1.0
  description: |
    Accounts, sessions and the game lobby. Live play (moves, readiness, updates) goes over the WebSocket described in
    `asyncapi.yaml`.

    Behind the nginx in `docker-compose.yml` every path here is served under `/api`.

    The request and response bodies are the types in `packages/shared/src/rest-types.ts`; the schema names below are
    the type names.

    Every error has one shape, `{ "error": { "code", "message", "details"? } }` (`ErrorResponse`), the same as the
    payload of a WebSocket `error`. `code` is stable and meant for programs. `details.issues` lists the fields of a
    failed validation. A 5xx always carries the code `internal` and a fixed message, so it never names an internal
    detail; the details stay in the server log.
servers:
  - url: http://localhost:3000
    description: Server run directly
  - url: http://localhost:8080/api
    description: Through the compose nginx
security:
  - sessionCookie: []
tags:
  - name: Health
  - name: Session
  - name: Users
  - name: Games
paths:
  /healthz:
    get:
      tags: [Health]
      summary: Process is up
      security: []
      responses:
        "200":
          description: OK
          content:
            text/plain:
              schema: { type: string, examples: [OK] }
  /readyz:
    get:
      tags: [Health]
      summary: Process is up and the database answers
      security: []
      responses:
        "200":
          description: OK
          content:
            text/plain:
              schema: { type: string, examples: [OK] }
        "503":
          description: The database did not answer
          content:
            text/plain:
              schema: { type: string, examples: [Service Unavailable] }
  /session:
    post:
      tags: [Session]
      summary: Log in
      description: |
        Sets the `token` cookie (a JWT valid for 5 hours). An unknown user, a wrong password and an account without a
        password all give the same 401. Only failed logins count against the limit, per client and username.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              properties:
                username: { type: string, minLength: 1 }
                password: { type: string, minLength: 1 }
      responses:
        "200":
          description: Logged in
          headers:
            Set-Cookie:
              description: "`token=<jwt>; HttpOnly; SameSite=Lax; Path=/`, plus `Secure` when the request was https."
              schema: { type: string }
          content:
            text/plain:
              schema: { type: string, examples: [OK] }
        "400":
          $ref: "#/components/responses/ValidationFailed"
        "401":
          description: Invalid username or password
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          description: The JWT secret is not set, or the lookup failed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
  /logout:
    post:
      tags: [Session]
      summary: Log out
      description: Clears the `token` cookie.
      security: []
      responses:
        "200":
          description: Logged out
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MessageResponse" }
  /me:
    get:
      tags: [Session]
      summary: The logged-in user
      responses:
        "200":
          description: The user behind the cookie
          content:
            application/json:
              schema:
                type: object
                required: [id, username]
                properties:
                  id: { type: integer }
                  username: { type: string }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "500": { $ref: "#/components/responses/GameServerError" }
  /ws-ticket:
    post:
      tags: [Session]
      summary: A one-time ticket for opening a WebSocket from a browser
      description: |
        A browser cannot set headers on the WebSocket handshake, and the session cookie alone is not accepted there.
        Ask for a ticket, then open `ws://host/ws?ticket=<ticket>`. A ticket works once and expires after 30 seconds,
        so each connection, including every reconnect, asks for a new one. Tickets are kept in the server's memory.
      responses:
        "200":
          description: The ticket
          content:
            application/json:
              schema:
                type: object
                required: [ticket]
                properties:
                  ticket: { type: string }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /users:
    post:
      tags: [Users]
      summary: Register
      description: |
        Counted against the registration limit, per client. `REGISTRATION_ENABLED=false` makes this answer 403.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              properties:
                username: { type: string, minLength: 1 }
                password: { type: string, minLength: 8 }
      responses:
        "201":
          description: The new user
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UserView" }
        "400":
          $ref: "#/components/responses/ValidationFailed"
        "403":
          description: Registration is disabled
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "409":
          description: The username is taken
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          description: The database did not answer, or the insert failed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
  /users/{username}:
    get:
      tags: [Users]
      summary: Look a user up by name
      description: Needs no login.
      security: []
      parameters:
        - name: username
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: The user
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UserView" }
        "400":
          $ref: "#/components/responses/ValidationFailed"
        "404":
          description: No such user
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "500":
          description: The lookup failed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
  /games:
    get:
      tags: [Games]
      summary: Games that can still be joined
      responses:
        "200":
          description: Open games
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/GameSummary" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "500": { $ref: "#/components/responses/GameServerError" }
    post:
      tags: [Games]
      summary: Create a game
      description: |
        The creator is added as the first player. The body may be left out: the defaults apply.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                maxPlayers: { type: integer, minimum: 2, maximum: 4, default: 2 }
      responses:
        "200":
          description: The new game
          content:
            application/json:
              schema:
                type: object
                required: [gameId]
                properties:
                  gameId: { type: integer }
        "400": { $ref: "#/components/responses/GameError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "500": { $ref: "#/components/responses/GameServerError" }
  /games/my:
    get:
      tags: [Games]
      summary: Games the user plays in, in any status
      responses:
        "200":
          description: The user's games
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/GameSummary" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "500": { $ref: "#/components/responses/GameServerError" }
  /games/{gameId}:
    get:
      tags: [Games]
      summary: A game as the logged-in user sees it
      description: The same view as the payload of a WebSocket `game_state`. `viewer.availableMoves` has moves only when it is the user's turn.
      parameters:
        - $ref: "#/components/parameters/GameId"
      responses:
        "200":
          description: The game view
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GameView" }
        "400": { $ref: "#/components/responses/GameError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/GameError" }
        "500": { $ref: "#/components/responses/GameServerError" }
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: token
      description: The JWT set by `POST /session`.
  parameters:
    GameId:
      name: gameId
      in: path
      required: true
      schema: { type: integer, minimum: 1 }
  responses:
    Unauthorized:
      description: No token
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
    Forbidden:
      description: The token is invalid or expired, or its user no longer exists
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
    TooManyRequests:
      description: |
        Over the limit. The global limit is 300 requests a minute per client. Failed logins (per client and
        username) and registrations (per client) are also limited to 20 each per 15 minutes (`AUTH_RATE_LIMIT`).
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
    ValidationFailed:
      description: The body failed validation. The submitted values are not echoed.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
    GameError:
      description: A game rule or lookup failed, or the game id or `maxPlayers` is not valid
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
    GameServerError:
      description: |
        An unexpected failure: `error.code` is `internal` and the message is fixed. The details stay in the server log.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
  schemas:
    MessageResponse:
      type: object
      required: [message]
      properties:
        message: { type: string }
    ErrorResponse:
      description: The same `{ code, message, details? }` as the payload of a WebSocket `error`.
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              enum:
                - invalid_message
                - invalid_payload
                - unknown_type
                - game_not_found
                - game_full
                - already_in_game
                - not_in_game
                - invalid_game_state
                - not_your_turn
                - illegal_move
                - validation_failed
                - unauthorized
                - forbidden
                - user_exists
                - user_not_found
                - rate_limited
                - internal
              examples: [game_not_found]
            message: { type: string, examples: [Game not found] }
            details:
              type: object
              required: [issues]
              properties:
                issues:
                  type: array
                  items:
                    type: object
                    required: [path, message]
                    properties:
                      path: { type: array, items: { type: string }, examples: [[username]] }
                      message: { type: string, examples: [Username is required] }
    UserView:
      type: object
      required: [id, username, displayName, createdAt]
      properties:
        id: { type: integer }
        username: { type: string }
        displayName: { type: string }
        createdAt: { type: string, format: date-time }
    Position:
      type: object
      required: [x, y]
      properties:
        x: { type: integer, minimum: 0, maximum: 4 }
        y: { type: integer, minimum: 0, maximum: 4 }
    PlayerView:
      type: object
      required: [id, userId, seat, status, isReady]
      properties:
        id: { type: integer, description: Player id inside the game }
        userId: { type: integer }
        seat: { type: integer }
        status: { type: string, enum: [active, disconnected, blocked, eliminated] }
        isReady: { type: boolean }
    GameStatus:
      type: string
      enum: [waiting, in-progress, completed]
    GamePhase:
      type: [string, "null"]
      enum: [placing, moving, building, null]
    GameSummary:
      type: object
      required:
        [id, creatorId, maxPlayers, status, phase, currentPlayerId, turnNumber, version, playerCount, players, createdAt, startedAt, finishedAt]
      properties:
        id: { type: integer }
        creatorId: { type: integer }
        maxPlayers: { type: integer }
        status: { $ref: "#/components/schemas/GameStatus" }
        phase: { $ref: "#/components/schemas/GamePhase" }
        currentPlayerId: { type: [integer, "null"] }
        turnNumber: { type: integer }
        version: { type: integer }
        playerCount: { type: integer }
        players:
          type: array
          items: { $ref: "#/components/schemas/PlayerView" }
        createdAt: { type: string, format: date-time }
        startedAt: { type: [string, "null"], format: date-time }
        finishedAt: { type: [string, "null"], format: date-time }
    Move:
      description: A move the server offers or accepts. The `type` says which fields are present.
      oneOf:
        - type: object
          required: [type, workerId, position]
          properties:
            type: { const: place_worker }
            workerId: { type: integer }
            position: { $ref: "#/components/schemas/Position" }
        - type: object
          required: [type, workerId, fromPosition, position]
          properties:
            type: { const: move_worker }
            workerId: { type: integer }
            fromPosition: { $ref: "#/components/schemas/Position" }
            position: { $ref: "#/components/schemas/Position" }
        - type: object
          required: [type, workerId, position]
          properties:
            type: { enum: [build_block, build_dome] }
            workerId: { type: integer }
            position: { $ref: "#/components/schemas/Position" }
    GameView:
      description: |
        A game as one user sees it. `currentPlayerId` and `winnerPlayerId` are per-game player ids, not user ids.
      type: object
      required: [gameId, status, phase, maxPlayers, currentPlayerId, turnNumber, version, board, players, winnerPlayerId, winReason, viewer]
      properties:
        gameId: { type: integer }
        status: { $ref: "#/components/schemas/GameStatus" }
        phase: { $ref: "#/components/schemas/GamePhase" }
        maxPlayers: { type: integer }
        currentPlayerId: { type: [integer, "null"] }
        turnNumber: { type: integer }
        version:
          type: integer
          description: Grows with every change, so a client can drop an update older than the one it holds.
        board:
          type: object
          required: [cells]
          properties:
            cells:
              type: array
              description: 5 columns of 5 cells, indexed `cells[x][y]`
              items:
                type: array
                items:
                  type: object
                  required: [height, hasDome, worker]
                  properties:
                    height: { type: integer, minimum: 0, maximum: 3 }
                    hasDome: { type: boolean }
                    worker:
                      oneOf:
                        - type: "null"
                        - type: object
                          required: [playerId, workerId]
                          properties:
                            playerId: { type: integer }
                            workerId: { type: integer }
        players:
          type: array
          items: { $ref: "#/components/schemas/PlayerView" }
        winnerPlayerId: { type: [integer, "null"] }
        winReason: { type: [string, "null"] }
        viewer: { $ref: "#/components/schemas/Viewer" }
    Viewer:
      description: Who is looking. A player gets the moves they can play now; a watcher, or someone whose seat was freed, gets none.
      oneOf:
        - type: object
          required: [role, playerId, isCurrentPlayer, availableMoves]
          properties:
            role: { const: player }
            playerId: { type: integer }
            isCurrentPlayer: { type: boolean }
            availableMoves:
              type: array
              description: Empty unless it is this player's turn
              items: { $ref: "#/components/schemas/Move" }
        - type: object
          required: [role]
          properties:
            role: { const: spectator }
