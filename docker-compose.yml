# Runs the whole app: docker compose up --build
# Needs JWT_SECRET and DB_PASSWORD (see .env.example). Only the frontend is published.

x-server: &server
  build:
    context: packages/server
    additional_contexts:
      shared: packages/shared
  image: ${SANTORINI_SERVER_IMAGE:-santorini-server:check}
  environment:
    JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET}
    DB_HOST: postgres
    DB_USER: ${DB_USER:-santorini}
    DB_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD}
    DB_DATABASE: ${DB_DATABASE:-santorini}

services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_USER: ${DB_USER:-santorini}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD}
      POSTGRES_DB: ${DB_DATABASE:-santorini}
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  migrate:
    <<: *server
    command: ["node", "dist/server/src/runMigrations.js"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  server:
    <<: *server
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  client:
    build:
      context: packages/client-react
      additional_contexts:
        shared: packages/shared
    image: ${SANTORINI_CLIENT_IMAGE:-santorini-client:check}
    environment:
      BACKEND_URL: http://server:3000
    ports:
      - "${PORT:-8080}:8080"
    depends_on:
      server:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres-data:
