name: Dependencies

on:
  push:
    branches:
      - main
    paths:
      - packages/server/**
      - packages/client-react/**
      - packages/shared/**
      - packages/engine/**
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - .github/workflows/dependencies.yml
  pull_request:
    paths:
      - packages/server/**
      - packages/client-react/**
      - packages/shared/**
      - packages/engine/**
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - .github/workflows/dependencies.yml

permissions:
  contents: read

jobs:
  unused:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        package:
          - server
          - client-react

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@v6.1.1

      - name: Set up Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version: 26
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build the shared and engine packages
        run: pnpm run build:libraries

      - name: Check for unused and unlisted dependencies
        run: pnpm run knip
        working-directory: packages/${{ matrix.package }}
