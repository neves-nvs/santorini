name: Dependencies

on:
  push:
    branches:
      - main
    paths:
      - packages/server/**
      - packages/client-react/**
      - .github/workflows/dependencies.yml
  pull_request:
    paths:
      - packages/server/**
      - packages/client-react/**
      - .github/workflows/dependencies.yml

permissions:
  contents: read

jobs:
  unused:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        package:
          - server
          - client-react

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version: 26

      - name: Install dependencies
        run: npm ci
        working-directory: packages/${{ matrix.package }}

      - name: Check for unused and unlisted dependencies
        run: npm run knip
        working-directory: packages/${{ matrix.package }}
