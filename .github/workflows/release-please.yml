name: Release Please

on:
  # Paused: no release pull request is opened until the push trigger is back. Only a manual run is left, so the file
  # stays valid and the action stays in actions.lock.
  # push:
  #   branches:
  #     - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-please:
    runs-on: ubuntu-latest

    steps:
      # A personal access token, because tags and pull requests made with GITHUB_TOKEN do not trigger other workflows.
      - name: Open or update the release pull request
        uses: googleapis/release-please-action@v5.0.0
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
