name: Docker

on:
  push:
    branches:
      - main
    paths:
      - docker-bake.hcl
      - scripts/docker-build
      - scripts/docker-check
      - .github/scripts/summarize-images
      - packages/server/**
      - packages/client-react/**
      - packages/shared/**
      - .github/workflows/docker.yml
  pull_request:
    paths:
      - docker-bake.hcl
      - scripts/docker-build
      - scripts/docker-check
      - .github/scripts/summarize-images
      - packages/server/**
      - packages/client-react/**
      - packages/shared/**
      - .github/workflows/docker.yml

permissions:
  contents: read

jobs:
  image:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Generate the server image metadata
        id: meta-server
        uses: docker/metadata-action@v6.2.0
        with:
          images: santorini-server
          bake-target: metadata-server
          tags: |
            type=raw,value=check
            type=sha,format=long,prefix=
          labels: |
            org.opencontainers.image.title=santorini-server

      - name: Generate the frontend image metadata
        id: meta-client
        uses: docker/metadata-action@v6.2.0
        with:
          images: santorini-client
          bake-target: metadata-client
          tags: |
            type=raw,value=check
            type=sha,format=long,prefix=
          labels: |
            org.opencontainers.image.title=santorini-client

      - name: Build the images
        uses: docker/bake-action@v7.5.0
        with:
          files: |
            ./docker-bake.hcl
            cwd://${{ steps.meta-server.outputs.bake-file }}
            cwd://${{ steps.meta-client.outputs.bake-file }}
          load: true

      - name: Run the images against Postgres
        run: scripts/docker-check
        env:
          SANTORINI_SKIP_BUILD: "1"

      - name: Summarize the images
        if: always()
        run: .github/scripts/summarize-images santorini-server:check santorini-client:check >> "$GITHUB_STEP_SUMMARY"
