name: CI

on:
  push:
    branches:
      - main
    paths:
      - packages/server/**
      - packages/shared/**
      - packages/engine/**
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - .github/workflows/ci.yml
  pull_request:
    paths:
      - packages/server/**
      - packages/shared/**
      - packages/engine/**
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - .github/workflows/ci.yml

permissions:
  contents: read

jobs:
  shared:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@v6.1.1

      - name: Set up Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version: 26
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build the workspace libraries
        run: pnpm run build:libraries

      - name: Type-check
        run: pnpm run typecheck
        working-directory: packages/shared

  engine:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@v6.1.1

      - name: Set up Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version: 26
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type-check
        run: pnpm run typecheck
        working-directory: packages/engine

      - name: Test
        run: pnpm test
        working-directory: packages/engine

      - name: Build
        run: pnpm --filter @santorini/engine run build

  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@v6.1.1

      - name: Set up Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version: 26
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build the shared and engine packages
        run: pnpm run build:libraries

      - name: Setup environment variables
        run: echo "JWT_SECRET=secret" >> .env
        working-directory: packages/server

      - name: Run tests with coverage
        run: pnpm run test:coverage
        working-directory: packages/server

      - name: Summarise coverage
        run: |
          node -e '
            const { total } = JSON.parse(require("fs").readFileSync("coverage/coverage-summary.json", "utf8"));
            const rows = ["lines", "statements", "functions", "branches"].map((metric) => `| ${metric} | ${total[metric].pct}% | ${total[metric].covered} / ${total[metric].total} |`);
            console.log(["## Server test coverage", "", "| Metric | Coverage | Covered / total |", "| --- | --- | --- |", ...rows].join("\n"));
          ' >> "$GITHUB_STEP_SUMMARY"
        working-directory: packages/server

      - name: Archive the coverage report
        uses: actions/upload-artifact@v7.0.2
        with:
          name: server-coverage
          path: packages/server/coverage/cobertura-coverage.xml
          if-no-files-found: error
