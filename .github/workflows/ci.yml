name: CI

on:
  push:
    branches:
      - main
    paths:
      - packages/server/**
      - packages/shared/**
      - .github/workflows/ci.yml
  pull_request:
    paths:
      - packages/server/**
      - packages/shared/**
      - .github/workflows/ci.yml

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version: 26

      - name: Cache node modules
        id: node-modules-cache
        uses: actions/cache@v6.1.0
        with:
          path: packages/server/node_modules
          key: ${{ runner.os }}-node-26-${{ hashFiles('packages/server/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-26-

      - name: Install dependencies
        run: npm ci
        working-directory: packages/server

      - name: Setup environment variables
        run: echo "JWT_SECRET=secret" >> .env
        working-directory: packages/server

      - name: Run tests with coverage
        run: npm run test:coverage
        working-directory: packages/server

      - name: Summarise coverage
        run: |
          node -e '
            const { total } = JSON.parse(require("fs").readFileSync("coverage/coverage-summary.json", "utf8"));
            const rows = ["lines", "statements", "functions", "branches"].map((metric) => `| ${metric} | ${total[metric].pct}% | ${total[metric].covered} / ${total[metric].total} |`);
            console.log(["## Server test coverage", "", "| Metric | Coverage | Covered / total |", "| --- | --- | --- |", ...rows].join("\n"));
          ' >> "$GITHUB_STEP_SUMMARY"
        working-directory: packages/server

      - name: Archive the coverage report
        uses: actions/upload-artifact@v7.0.2
        with:
          name: server-coverage
          path: packages/server/coverage/cobertura-coverage.xml
          if-no-files-found: error
