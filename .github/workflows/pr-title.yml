name: Pull request title

on:
  pull_request:
    types:
      - opened
      - edited
      - synchronize
      - reopened

permissions:
  pull-requests: read

jobs:
  title:
    runs-on: ubuntu-latest

    steps:
      # Squash merges use the pull request title as the commit subject, and release-please reads it.
      - name: Check the title has a conventional prefix
        uses: amannn/action-semantic-pull-request@v6.1.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            perf
            revert
            docs
            style
            chore
            refactor
            test
            build
            ci
