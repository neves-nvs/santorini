version: 2
updates:
  - package-ecosystem: npm
    directories:
      - /packages/server
      - /packages/client-react
      - /packages/shared
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      security:
        applies-to: security-updates
        patterns:
          - "*"
      minor-and-patch:
        applies-to: version-updates
        update-types:
          - minor
          - patch
    ignore:
      - dependency-name: "*"
        update-types:
          - version-update:semver-major

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns:
          - "*"
